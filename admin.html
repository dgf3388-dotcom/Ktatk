<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة قطعتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{background:var(--gray)}
.top{background:var(--navy);color:#fff;padding:14px 0}.top .container{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .logo{color:#fff;font-size:1.3rem}
.login{max-width:380px;margin:80px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:var(--sh)}
.login h2{color:var(--navy);margin-bottom:16px}.login label{margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.stat{background:#fff;border-radius:14px;padding:14px;border-inline-start:5px solid var(--orange)}
.stat b{display:block;font-size:1.7rem;color:var(--navy)}.stat span{color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select{width:auto;flex:1;min-width:150px}
.tbl{background:#fff;border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 12px;text-align:start;border-bottom:1px solid var(--line);font-size:.92rem}
th{background:#f8fafc;color:var(--navy)}tr.row{cursor:pointer}tr.row:hover{background:#fffaf2}
.badge{padding:3px 10px;border-radius:20px;background:#e8eef7;color:var(--navy);font-size:.8rem;font-weight:700;white-space:nowrap}
.badge.new{background:#fff0d9;color:#a35a00}.badge.completed{background:#dff5e8;color:var(--ok)}.badge.unavailable{background:#fdecec;color:var(--err)}
.modal{position:fixed;inset:0;background:rgba(8,39,70,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:100}
.modal.open{display:flex}.panel{background:#fff;border-radius:18px;width:min(760px,100%);padding:24px;margin:auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:14px 0}.kv div{font-size:.92rem}.kv b{color:var(--navy);display:block;font-size:.8rem}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.imgs img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
@media(max-width:600px){.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView" class="login" hidden>
  <h2>دخول الإدارة</h2>
  <label for="em">البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username">
  <label for="pw">كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password">
  <div id="loginErr" class="alert error" hidden></div>
  <button class="btn btn-primary" style="width:100%;margin-top:16px" id="loginBtn">دخول</button>
</div>

<div id="appView" hidden>
  <div class="top"><div class="container"><div class="logo"><svg style="width:28px;height:28px"><use href="#gear"/></svg>قطعتك — الإدارة</div><button class="btn btn-ghost" id="logout" style="padding:6px 16px">تسجيل خروج</button></div></div>
  <svg width="0" height="0" style="position:absolute"><defs><symbol id="gear" viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="none" stroke="#FF8A00" stroke-width="7" stroke-dasharray="5.1 5.1"/><circle cx="20" cy="20" r="12" fill="#FF8A00"/><circle cx="20" cy="20" r="5.5" fill="#fff"/></symbol></defs></svg>
  <div class="container">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="q" placeholder="بحث: اسم العميل / رقم الجوال / رقم الطلب">
      <select id="fs"></select>
      <label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="arch" style="width:auto"> عرض المؤرشف</label>
      <button class="btn btn-outline" id="reload" style="padding:8px 16px">تحديث</button>
    </div>
    <div class="tbl"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الجوال</th><th>السيارة</th><th>القطعة</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p id="empty" class="sec-sub" style="margin:30px" hidden>لا توجد طلبات.</p>
  </div>
</div>

<div class="modal" id="modal"><div class="panel" id="panel"></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
